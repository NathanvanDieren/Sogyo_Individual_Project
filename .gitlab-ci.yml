image: mcr.microsoft.com/dotnet/sdk:10.0

stages:
  - build
  - test


build_backend:
  stage: build
  script:
    - cd backend
    - dotnet clean
    - dotnet build

build_frontend:
  stage: build
  image: node:20
  script:
    - cd frontend
    - npm run build
  

test_backend:
  stage: test
  script: 
    - cd backend
    - dotnet clean
    - dotnet test