image: mcr.microsoft.com/dotnet/sdk:10.0

stages:
  - build
  - test

build_backend:
  stage: build
  script:
    - cd backend
    - dotnet restore 
    - dotnet build --no-restore -c Release    

build_frontend:
  stage: build
  image: node:20
  script:
    - cd frontend
    - npm ci
    - npm run build

test_backend:
  stage: test
  script:
    - cd backend
    - 'dotnet test Domain.Tests/Domain.Tests.csproj --logger:"junit;LogFileName=../../artifacts/testresult.xml"'
  artifacts:
    when: always
    reports:
      junit:
        - "backend/artifacts/testresult.xml"
      